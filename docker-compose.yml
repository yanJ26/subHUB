services:
  subhub:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/code/subhub}
    container_name: subhub
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/code/subhub}
      SUBHUB_GATEWAY_INTERNAL_URL: http://subhub-gateway:8790/v1/web
      SUBHUB_WEB_INTERNAL_TOKEN: ${SUBHUB_WEB_INTERNAL_TOKEN:?Set SUBHUB_WEB_INTERNAL_TOKEN in .env}
      SUBHUB_WEB_PASSWORD: ${SUBHUB_WEB_PASSWORD:?Set SUBHUB_WEB_PASSWORD in .env}
      SUBHUB_WEB_SESSION_SECRET: ${SUBHUB_WEB_SESSION_SECRET:?Set SUBHUB_WEB_SESSION_SECRET in .env}
      SUBHUB_PUBLIC_ORIGIN: ${SUBHUB_PUBLIC_ORIGIN:?Set the public HTTPS origin in .env}
      SUBHUB_TRUST_PROXY_HEADERS: ${SUBHUB_TRUST_PROXY_HEADERS:-false}
      SUBHUB_MAX_BODY_BYTES: ${SUBHUB_MAX_BODY_BYTES:-2097152}
    depends_on:
      subhub-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:3003:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "const p=process.env.NEXT_PUBLIC_BASE_PATH||'';fetch('http://127.0.0.1:3000'+p+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 15s

  subhub-gateway:
    build: ./gateway
    container_name: subhub-gateway
    restart: unless-stopped
    environment:
      SUBHUB_GATEWAY_HOST: 0.0.0.0
      SUBHUB_GATEWAY_PORT: 8790
      SUBHUB_DB_PATH: /data/subhub.sqlite
      SUBHUB_WEB_INTERNAL_TOKEN: ${SUBHUB_WEB_INTERNAL_TOKEN:?Set SUBHUB_WEB_INTERNAL_TOKEN in .env}
      SUBHUB_EXCHANGE_RATE_URL: ${SUBHUB_EXCHANGE_RATE_URL:-https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml}
      SUBHUB_MAX_BODY_BYTES: ${SUBHUB_MAX_BODY_BYTES:-2097152}
      SUBHUB_BACKUP_DIR: ${SUBHUB_BACKUP_DIR:-/backups}
      SUBHUB_BACKUP_RETENTION: ${SUBHUB_BACKUP_RETENTION:-14}
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - subhub-data:/data
      - subhub-backups:/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    stop_grace_period: 15s

volumes:
  subhub-data:
  subhub-backups:
