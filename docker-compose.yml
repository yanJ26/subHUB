services:
  subhub:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/code/subhub}
    container_name: subhub
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/code/subhub}
      SUBHUB_GATEWAY_INTERNAL_URL: http://subhub-gateway:8790/v1/web
      SUBHUB_WEB_INTERNAL_TOKEN: ${SUBHUB_WEB_INTERNAL_TOKEN:?Set SUBHUB_WEB_INTERNAL_TOKEN in .env}
      SUBHUB_WEB_PASSWORD: ${SUBHUB_WEB_PASSWORD:?Set SUBHUB_WEB_PASSWORD in .env}
      SUBHUB_WEB_SESSION_SECRET: ${SUBHUB_WEB_SESSION_SECRET:?Set SUBHUB_WEB_SESSION_SECRET in .env}
    depends_on:
      - subhub-gateway
    ports:
      - "3003:3000"

  subhub-gateway:
    build: ./gateway
    container_name: subhub-gateway
    restart: unless-stopped
    environment:
      SUBHUB_GATEWAY_HOST: 0.0.0.0
      SUBHUB_GATEWAY_PORT: 8790
      SUBHUB_DB_PATH: /data/subhub.sqlite
      SUBHUB_WEB_INTERNAL_TOKEN: ${SUBHUB_WEB_INTERNAL_TOKEN:?Set SUBHUB_WEB_INTERNAL_TOKEN in .env}
      SUBHUB_EXCHANGE_RATE_URL: ${SUBHUB_EXCHANGE_RATE_URL:-https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml}
      SUBHUB_MAX_BODY_BYTES: ${SUBHUB_MAX_BODY_BYTES:-2097152}
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - subhub-data:/data

volumes:
  subhub-data:
